version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aulten-taskpulse-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - aulten-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aulten-taskpulse-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - aulten-network

networks:
  aulten-network:
    driver: bridge
